<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PCubed Interactive Figures</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --link: #1f77b4;
      --border: #e5e7eb;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    ul.file-list {
      list-style: none;
      padding: 0;
      margin: 24px 0 0 0;
    }
    ul.file-list li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: box-shadow .15s ease, transform .05s ease;
    }
    ul.file-list li:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transform: translateY(-1px);
    }
    a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
    .filename {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      margin-left: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PCubed Interactive Figures</h1>
      <p>Snappy, self-contained physics visuals. Pick a topic to browse figures.</p>
    </header>
    <ul class="file-list">
      <li><a href="interactive/mechanics/index.html">Mechanics</a> <span class="filename">interactive/mechanics/</span></li>
    </ul>
  </div>
</body>
</html>
